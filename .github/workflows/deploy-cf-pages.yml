# ══════════════════════════════════════════════════════════════════
# Dashboard Deploy — Build & Deploy to Cloudflare Pages
# ══════════════════════════════════════════════════════════════════
# 触发: Push to main 或手动 workflow_dispatch

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options: [preview, production]

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Generate GraphQL types
        run: pnpm run generate
        env:
          API_URL: https://api.tiptoppick.com/graphql/

      - name: Build
        run: pnpm run build
        env:
          API_URL: https://api.tiptoppick.com/graphql/
          APP_MOUNT_URI: /dashboard/
          STATIC_URL: /dashboard/
          IS_CLOUD_INSTANCE: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/dashboard/ --project-name=saleor-dashboard --branch=${{ github.ref_name }}
          packageManager: npm
